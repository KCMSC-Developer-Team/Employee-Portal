name: ci
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: kcmsc, POSTGRES_PASSWORD: ci-only, POSTGRES_DB: kcmsc_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kcmsc" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://kcmsc:ci-only@localhost:5432/kcmsc_test?schema=public
      TEST_DATABASE_URL: postgresql://kcmsc:ci-only@localhost:5432/kcmsc_test?schema=public
      APP_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      FILE_STORAGE_DIR: ./storage-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run test:unit
      # Fresh DB: schema, then the guard triggers/indexes (required by the security suite).
      - run: npx prisma db push --skip-generate
      - run: npm run db:guards
      # Release-blocking: a failure here must block merge/deploy.
      - run: npm run test:security
      - run: npm run build
